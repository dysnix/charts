suite: deployment
templates:
  - deployment.yaml
tests:
  -
    it: chart naming
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-app-name
  -
    it: .namespaceOverride
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
      namespaceOverride: foo
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.namespace
          value: foo
  -
    it: release name is equal to release+.app.name
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
    release:
      name: foo
    asserts:
      - equal:
          path: metadata.name
          value: foo-app-name
  -
    it: image naming
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: foo/alpine:bar
  -
    it: selector matchLabels
    values:
      - ./values/common.yaml
    asserts:
      - isSubset:
          path: spec.selector.matchLabels
          content:
            tenant: foo
  -
    it: deployment labels
    values:
      - ./values/common.yaml
    asserts:
     - isSubset:
        path: metadata.labels
        content:
          common: label
     - isSubset:
        path: spec.template.metadata.labels
        content:
          common: label
          pod: label
  -
    it: .enableServiceLinks defaults to true
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true
  -
    it: .enableServiceLinks false is rendered
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
      enableServiceLinks: false
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
  -
    it: .enableServiceLinks quoted "false" still renders false
    values:
      - ./values/common.yaml
    set:
      app.workload.type: deployment
      enableServiceLinks: "false"
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false